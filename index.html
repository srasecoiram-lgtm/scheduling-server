<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scheduling Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="toast"></div>

<header>
  <div class="logo">
    <div class="logo-icon"><i class="ti ti-calendar-event"></i></div>
    <div>
      <div class="logo-text">Scheduling</div>
      <div class="logo-sub">Gerenciador de agendamentos</div>
    </div>
  </div>
  <div class="ws-pill">
    <div class="ws-dot" id="ws-dot"></div>
    <span id="ws-label">desconectado</span>
  </div>
</header>

<div class="metrics">
  <div class="metric">
    <div class="metric-label"><i class="ti ti-calendar"></i> Agendamentos</div>
    <div class="metric-value" id="m-total">—</div>
  </div>
  <div class="metric">
    <div class="metric-label"><i class="ti ti-building"></i> Recursos</div>
    <div class="metric-value" id="m-resources">—</div>
  </div>
  <div class="metric">
    <div class="metric-label"><i class="ti ti-users"></i> Proprietários</div>
    <div class="metric-value" id="m-owners">—</div>
  </div>
</div>

<div class="layout">

  <!-- Lista de agendamentos -->
  <div class="card">
    <div class="card-head">
      <span class="card-title">Agendamentos</span>
      <button class="btn-icon" onclick="loadSchedules()" title="Atualizar">
        <i class="ti ti-refresh"></i>
      </button>
    </div>
    <div class="filter-row">
      <input id="f-resource" placeholder="Filtrar por recurso..." />
      <input id="f-owner" placeholder="Filtrar por proprietário..." />
    </div>
    <div class="sched-list" id="sched-list">
      <div class="loading-row">Carregando...</div>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">

    <!-- Formulário -->
    <div class="card">
      <div class="card-head"><span class="card-title">Novo agendamento</span></div>
      <div class="form-grid">
        <div id="conflict-banner" class="conflict-banner">
          <i class="ti ti-alert-triangle"></i>
          Conflito de horário detectado
        </div>
        <div class="field">
          <label>Recurso *</label>
          <input id="n-resource" placeholder="ex: sala-1, projetor-2" />
        </div>
        <div class="field">
          <label>Proprietário *</label>
          <input id="n-owner" placeholder="nome ou id do usuário" />
        </div>
        <div class="field">
          <label>Título *</label>
          <input id="n-title" placeholder="ex: Reunião de sprint" />
        </div>
        <div class="form-row">
          <div class="field">
            <label>Início *</label>
            <input id="n-start" type="datetime-local" />
          </div>
          <div class="field">
            <label>Fim *</label>
            <input id="n-end" type="datetime-local" />
          </div>
        </div>
        <div class="field">
          <label>Descrição</label>
          <textarea id="n-desc" placeholder="Opcional..."></textarea>
        </div>
        <button class="btn-primary" id="btn-create" onclick="createSchedule()">
          <i class="ti ti-plus"></i> Criar agendamento
        </button>
      </div>
    </div>

    <!-- Notificações -->
    <div class="card">
      <div class="card-head"><span class="card-title">Notificações</span></div>
      <div class="notif-row">
        <input id="notif-user" placeholder="usuário..." />
        <button class="btn-sm" onclick="loadNotifs()">
          <i class="ti ti-bell"></i> Buscar
        </button>
      </div>
      <div class="notif-list" id="notif-list">
        <div class="empty"><i class="ti ti-bell-off"></i>Digite um usuário acima</div>
      </div>
    </div>

  </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
